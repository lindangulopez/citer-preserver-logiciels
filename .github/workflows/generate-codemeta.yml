name: Generate codemeta.json with SOMEF

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "codemeta.generated.json"

permissions:
  contents: write

jobs:
  generate-codemeta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SOMEF
        run: pip install somef

      - name: Configure SOMEF (first run only)
        # `somef configure` only exposes -a/--auto and -b/--base_uri on the CLI (verified
        # against somef 0.11.3 --help) — there is no CLI flag to pass a GitHub token here;
        # `--auto` just sets up the default classifier-model paths. The token instead goes
        # directly on `somef describe` below via --github-token.
        run: somef configure --auto

      - name: Generate codemeta.generated.json
        # Verified against `somef describe --help` (0.11.3): -c/--codemeta_out is the CodeMeta
        # output path (takes an argument — it is NOT a boolean flag, unlike an earlier version
        # of this workflow assumed). -t is the required confidence threshold. --github-token
        # authenticates GitHub API calls with the run's own token (4997/5000 requests seen in
        # testing) rather than the ~60/hour unauthenticated limit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          somef describe -r "https://github.com/${{ github.repository }}" \
            -c codemeta.generated.json -t 0.8 -p --github-token "$GH_TOKEN"

      # codemeta.json at the repo root is the hand-curated worked example (the "answer key"
      # attendees compare their own output against) — this workflow never overwrites it.
      # It only produces/updates codemeta.generated.json so the diff stays visible.
      - name: Show diff against the worked example
        run: diff -u codemeta.json codemeta.generated.json || true

      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet -- codemeta.generated.json || \
            (git add codemeta.generated.json && \
             git commit -m "chore: update codemeta.generated.json via SOMEF [skip ci]" && \
             git push)
