name: Validate codemeta.json

on:
  workflow_dispatch: {}
  push:
    paths:
      - "codemeta.json"
      - "codemeta.generated.json"
  pull_request:
    paths:
      - "codemeta.json"
      - "codemeta.generated.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codemetapy
        run: pip install codemetapy

      - name: Validate codemeta.json is well-formed JSON-LD
        # codemetapy's `-i json <file>` parses the file as JSON-LD and re-serializes it,
        # failing (non-zero exit) if it doesn't conform to CodeMeta's schema.org-based model.
        # Note: `--validate` is NOT a boolean flag — it takes a SHACL shape file to check
        # against, which we don't have here, so we don't use it.
        run: |
          for f in codemeta.json codemeta.generated.json; do
            if [ -f "$f" ]; then
              echo "Validating $f"
              python -c "import json,sys; json.load(open('$f'))" || exit 1
              codemetapy -i json "$f" -O "/tmp/$(basename "$f").validated"
            fi
          done
